<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050810"><title>Sign in with Deriv</title><style>body{margin:0;background:#050810;color:#eef7ff;font:15px system-ui,Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,calc(100% - 32px));background:#0b1220;border:1px solid #1d3046;border-radius:18px;padding:24px;box-sizing:border-box}.title{font-size:30px;font-weight:900}.muted{color:#8191a7;font-size:12px;line-height:1.6}.row{margin-top:14px}button{width:100%;height:48px;box-sizing:border-box;border:0;border-radius:10px;background:#287fa8;color:#fff;font-weight:900;cursor:pointer}.status{margin-top:14px;padding:12px;border-radius:10px;background:#07101a;color:#a9bdd1;font-size:12px;white-space:pre-wrap}.err{color:#ff9b9b}.ok{color:#75efbd}</style></head><body><main class="card"><div class="title">Sign in with Deriv</div><p class="muted">Secure OAuth 2.0 sign-in. Deriv handles your password and consent. After approval you will be returned automatically to the Dynamic Digit Analyzer.</p><div class="row"><button id="login">Continue with Deriv</button></div><div id="status" class="status">Ready.</div></main><script>const CLIENT_ID='34gdpbaGuWWOOcOfRj2Ex';const REDIRECT='https://sabry722.github.io/analysistool/deriv-login.html';const TOOL='https://sabry722.github.io/analysistool/';const $=id=>document.getElementById(id);function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function random(n=64){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x%66]).join('')}async function login(){try{const verifier=random(64),hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)),challenge=b64(hash),state=random(32);sessionStorage.setItem('deriv_oauth_verifier',verifier);sessionStorage.setItem('deriv_oauth_state',state);sessionStorage.setItem('deriv_return_to_tool','1');const u=new URL('https://auth.deriv.com/oauth2/auth');u.searchParams.set('response_type','code');u.searchParams.set('client_id',CLIENT_ID);u.searchParams.set('redirect_uri',REDIRECT);u.searchParams.set('scope','trade');u.searchParams.set('state',state);u.searchParams.set('code_challenge',challenge);u.searchParams.set('code_challenge_method','S256');$('status').textContent='Opening official Deriv sign-in…';location.assign(u.toString())}catch(e){$('status').className='status err';$('status').textContent='Unable to start Deriv sign-in: '+e.message}}function callback(){const p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state'),err=p.get('error');if(err){$('status').className='status err';$('status').textContent='Deriv authorization was not completed: '+(p.get('error_description')||err);return}if(!code)return;const saved=sessionStorage.getItem('deriv_oauth_state');if(!saved||state!==saved){$('status').className='status err';$('status').textContent='Security check failed: OAuth state mismatch. Start again.';return}sessionStorage.setItem('deriv_authorization_code',code);sessionStorage.setItem('deriv_authorized_at',String(Date.now()));history.replaceState({},document.title,REDIRECT);$('status').className='status ok';$('status').textContent='Deriv authorization approved. Returning to your analyzer…';setTimeout(()=>location.replace(TOOL+'?deriv=authorized'),500)}$('login').onclick=login;callback();</script></body></html>
