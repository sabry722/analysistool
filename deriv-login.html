<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in with Deriv</title><style>body{margin:0;background:#050810;color:#eef7ff;font:15px system-ui,Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,calc(100% - 32px));background:#0b1220;border:1px solid #1d3046;border-radius:18px;padding:24px;box-sizing:border-box}.title{font-size:30px;font-weight:900}.muted{color:#8191a7;font-size:12px;line-height:1.6}.row{margin-top:14px}label{display:block;font-size:10px;font-weight:900;color:#8191a7;margin-bottom:6px}input,button{width:100%;height:44px;box-sizing:border-box;border:1px solid #293c52;border-radius:10px;background:#070e17;color:#fff;padding:0 12px}button{background:#287fa8;font-weight:900;cursor:pointer}.status{margin-top:14px;padding:12px;border-radius:10px;background:#07101a;color:#a9bdd1;font-size:12px;white-space:pre-wrap}.ok{color:#38e39a}.warn{color:#ffd77a}</style></head><body><main class="card"><div class="title">Sign in with Deriv</div><p class="muted">Use Deriv's official OAuth 2.0 sign-in and consent screen. Your password and PAT are never entered into this page.</p><div class="row"><label>Deriv OAuth Client ID</label><input id="client" placeholder="Your OAuth client_id"></div><div class="row"><label>Redirect URI</label><input id="redirect" readonly></div><div class="row"><button id="login">Continue with Deriv</button></div><div id="status" class="status">Ready.</div></main><script>const $=id=>document.getElementById(id);const REDIRECT=location.origin+location.pathname;$("redirect").value=REDIRECT;function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function random(n=64){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x%66]).join('')}async function login(){const client=$("client").value.trim();if(!client){$("status").textContent='Enter the OAuth client ID from your Deriv developer application.';return}const verifier=random(64),hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)),challenge=b64(hash),state=random(32);sessionStorage.setItem('deriv_oauth_verifier',verifier);sessionStorage.setItem('deriv_oauth_state',state);sessionStorage.setItem('deriv_oauth_client',client);const u=new URL('https://auth.deriv.com/oauth2/auth');u.searchParams.set('response_type','code');u.searchParams.set('client_id',client);u.searchParams.set('redirect_uri',REDIRECT);u.searchParams.set('scope','trade');u.searchParams.set('state',state);u.searchParams.set('code_challenge',challenge);u.searchParams.set('code_challenge_method','S256');$("status").textContent='Redirecting to Deriv sign-in and consent…';location.href=u.toString()}async function callback(){const p=new URLSearchParams(location.search);const code=p.get('code'),state=p.get('state'),err=p.get('error');if(err){$("status").textContent='Deriv authorization cancelled or denied: '+(p.get('error_description')||err);return}if(!code)return;const saved=sessionStorage.getItem('deriv_oauth_state');if(!saved||state!==saved){$("status").textContent='Security check failed: OAuth state mismatch.';return}$("status").innerHTML='<span class="warn">Deriv consent approved.</span>\nAuthorization code received.\n\nFor security, the code must be exchanged for the access token by a server-side backend. This GitHub Pages site cannot safely perform that exchange.';sessionStorage.removeItem('deriv_oauth_state');}$("login").onclick=login;callback();</script></body></html>
