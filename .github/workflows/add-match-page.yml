name: Add Digit Match navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-match-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Match navigation if missing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="main-match-nav"'
          if marker in s:
              print('Digit Match navigation already present')
              raise SystemExit(0)

          button = '''<a id="main-match-nav" href="match.html" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 14px;margin:0 0 12px 0;border:1px solid #29435a;border-radius:10px;background:linear-gradient(135deg,#0d1d2c,#172b42);color:#edf6ff;text-decoration:none;font-weight:900;box-shadow:0 8px 24px #0005">🔢 Digit Match Extractor</a>'''

          target = '<header class="top">'
          if target not in s:
              raise SystemExit('Main analyzer header marker not found; no changes made')

          s = s.replace(target, target + button, 1)
          p.write_text(s, encoding='utf-8')
      
      - name: Commit navigation
        run: |
          if git diff --quiet; then
            echo "No navigation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Digit Match Extractor page to main analyzer"
          git push